function render(){
  const root = document.getElementById('root');
  syncBackButton();   // нативная кнопка «Назад» Telegram следует за экраном
  if(!S.onboarded){ root.innerHTML = obView(); wireOb(); return; }
  root.innerHTML = shell();
  const c = document.getElementById('content');
  const v = S.view;
  c.innerHTML =
    v==='astro' ? astroView() :
    v==='tarot' ? tarotView() :
    v==='numero' ? numeroView() :
    v==='companion' ? companionView() :
    v==='match' ? matchView() :
    v==='sign' ? signView() :
    S.tab==='today' ? todayView() :
    S.tab==='oracles' ? oraclesView() :
    S.tab==='collection' ? collectionView() : profileView();
  wire();
  c.scrollTop = 0;
}
function go(tab, view){ S.tab = tab; S.view = view||null; save(); render(); haptic('light'); }

/* Обновить только шапку — чтобы награда посреди чтения не смывала текст разбора */
function refreshHud(){
  const sp = document.getElementById('sparkChip');
  if(sp) sp.textContent = '✧ ' + S.sparks;
  const hot = document.querySelector('.chip.hot');
  if(hot) hot.textContent = '🔥 ' + S.streak.count;
  const ring = document.getElementById('lvlRing');
  if(ring){
    const L = levelInfo(), circ = 2*Math.PI*14;
    ring.querySelectorAll('circle')[1].setAttribute('stroke-dashoffset', circ*(1-L.pct/100));
    ring.querySelector('text').textContent = L.num;
  }
}
/* Внутри разбора не перерисовываем экран, на остальных вкладках — обычный render */
function smartRefresh(){ if(S.view) refreshHud(); else render(); }

/* ------------------------------- онбординг ------------------------------ */
function wireOb(){
  const next = document.getElementById('obNext');
  const back = document.getElementById('obBack');
  if(back) back.onclick = ()=>{ S.step--; save(); render(); };

  if(S.step===1){
    const inp = document.getElementById('obName');
    inp.oninput = ()=>{
      S.name = cleanName(inp.value);
      const nn = nameNumber(S.name.trim());
      document.getElementById('obNameHint').innerHTML =
        S.name.trim().length>=2 && nn ? instantCard('Число имени', nn, `«${numInfo(nn).t}» — так тебя читают снаружи: ${numInfo(nn).k}.`) : '';
      next.disabled = S.name.trim().length<2;
    };
    wireEnterDone(inp);
    setTimeout(()=>inp.focus(), 120);
  }
  if(S.step===2){
    /* render() только когда дата собрана целиком: перерисовка на каждом из трёх
       списков сбрасывала бы уже выбранное и не давала дозаполнить остальное.
       Пустое значение НЕ записывается: раньше любой промежуточный выбор затирал
       уже сохранённую дату, и достаточно было сбросить один список, чтобы
       потерять её целиком. Кнопка «Дальше» при этом блокируется — состояние
       интерфейса отражает текущий выбор, а данные остаются последними целыми. */
    wireDateSelects('obDate', v=>{
      if(v){ S.birth = v; save(); render(); }
      else next.disabled = true;
    });
  }
  if(S.step===3){
    document.getElementById('obFocus').querySelectorAll('.pill').forEach(p=>{
      p.onclick = ()=>{ S.focus = p.dataset.f; save(); render(); haptic('light'); };
    });
  }
  if(next) next.onclick = ()=>{
    haptic('light');
    if(S.step<3){ S.step++; save(); render(); return; }
    S.onboarded = true; S.tab='today'; S.xp += 20; S.sparks += 60;
    touchStreak();
    /* Ссылка приглашения (ref_/match_) читалась до онбординга, но routeStart()
       раньше не вызывался для неонбордившихся пользователей — самый ценный
       случай (новый человек по приглашению друга) молча терялся. Догоняем
       здесь: start_param всё ещё читается из того же initData/URL. */
    routeStart();
    save();
    render();
    setTimeout(()=>modalReward({
      icon:'✦', title:'Посвящение пройдено',
      text:`${S.name}, твоя карта составлена. Ты начинаешь с уровня «Искатель» и ${SPARK_COST} искрами — ровно на один глубокий разбор, чтобы понять, что это такое.`,
      btn:'Открыть карту дня', bonus:'+20 XP · +60 искр',
      onOk:()=>{ go(S.tab, S.view); applyPendingRef(); }
    }), 380);
  };
}

/* -------------------------------- основное ------------------------------ */
function wire(){
  document.querySelectorAll('.tab').forEach(t=>t.onclick = ()=>go(t.dataset.tab));
  /* data-go принимает либо имя корневой вкладки, либо id оракула. Раньше вкладкой
     считался только 'oracles', и любое другое значение уезжало в go('oracles', …)
     как view — из-за этого кнопка «Назад» со страницы знака вернула бы в Оракулы
     вместо Коллекции. Список вкладок задан явно. */
  const ROOT_TABS = ['today','oracles','collection','profile'];
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick = ()=>{
    const g = b.dataset.go;
    if(ROOT_TABS.includes(g)) go(g);
    else go('oracles', g);
  });

  /* Открыть страницу знака из справочника. Имя знака хранится в S.signOpen,
     а не в замыкании: после render() обработчики пересоздаются, и состояние
     должно жить в S, иначе экран знака не выдержит перерисовки. */
  document.querySelectorAll('[data-sign]').forEach(b=>b.onclick = ()=>{
    S.signOpen = b.dataset.sign;
    haptic('light');
    go('collection', 'sign');
  });
  document.querySelectorAll('[data-pay]').forEach(b=>b.onclick = ()=>openPaywall('plans'));

  /* Все три показателя в шапке объясняют себя по касанию. До этого пояснение
     было только у искр: чип серии не реагировал вообще, а кольцо уровня молча
     уводило в профиль — куда и так ведёт кнопка в нижней панели. Непонятный
     счётчик, который нельзя ни нажать, ни расспросить, читается как украшение. */
  const spark = document.getElementById('sparkChip');
  if(spark) spark.onclick = ()=>{ haptic('light'); toast(isPremium()
    ? `Искры — внутренняя валюта. С подпиской разборы уже безлимитны, но ✧${FREEZE_COST} = страховка серии на карточке дня.`
    : `Искры — внутренняя валюта. ✧${SPARK_COST} = один глубокий разбор без подписки, ✧${FREEZE_COST} = страховка серии.`, '✧'); };

  const streak = document.getElementById('streakChip');
  if(streak) streak.onclick = ()=>{
    haptic('light');
    const c = S.streak.count;
    toast(c === 0

/* Клавиатура в Telegram WebView на Android не закрывается сама: набрав вопрос,
   пользователь остаётся с клавиатурой поверх веера карт, пока не свайпнет вниз.
   У textarea штатной кнопки «готово» нет — Enter вставляет перенос строки,
   который в вопросе из одной фразы не нужен. Поэтому здесь Enter означает
   «закончил»: перенос не вставляется, фокус снимается, клавиатура уезжает.
   Shift+Enter оставлен тем, кому действительно нужен многострочный текст. */
function wireEnterDone(el){
  if(!el) return;
  el.setAttribute('enterkeyhint','done');
  el.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); el.blur(); }
  });
}
/* Снять фокус перед запуском разбора: иначе клавиатура закрывает и текст,
   и индикатор загрузки — то есть ровно то, на что человек только что нажал. */
function blurActive(){
  const a = document.activeElement;
  if(a && typeof a.blur === 'function' && /^(INPUT|TEXTAREA)$/.test(a.tagName)) a.blur();
}

function loading(msg){

function typewrite(el, html, done){
  let i=0, out='';
  el.classList.add('caret');
  const finish = ()=>{ el.innerHTML = html; el.classList.remove('caret'); done&&done(); };
  el.onclick = finish;
  const tick = ()=>{
    if(i>=html.length){ clearInterval(el._iv); finish(); return; }
    for(let k=0;k<3 && i<html.length;k++){
      if(html[i]==='<'){ const j=html.indexOf('>',i); out+=html.slice(i,j+1); i=j+1; }
      else { out+=html[i]; i++; }
    }
    el.innerHTML = out;
  };
  clearInterval(el._iv);
  el._iv = setInterval(tick, 16);
}

  unlockAch('match');
  completeQuest('match');
  addXP(15);
}

/* --------------------------------- ТАРО --------------------------------- */
function initTarot(){
  T = {order:null, picked:[], flipped:[false,false,false]};
  const r = rng(`deck|${S.name}|${Date.now()}`);
  T.order = pickN(DECK.map(c=>c[0]), DECK.length, r);
  T.revs = T.order.map(()=>r()<0.3);
  renderFan();
  renderSlots();
  document.getElementById('readTarot').onclick = readTarot;
}
function renderFan(){
  const fan = document.getElementById('fan');
  const n = DECK.length;
  fan.innerHTML = T.order.map((k,i)=>{
    const t = (i/(n-1))-0.5;                 // -0.5..0.5
    const rot = t*76, x = t*252;
    const taken = T.picked.some(p=>p.i===i);
    return `<div class="fc ${taken?'taken':''} ${T.picked.length===0&&i===Math.floor(n/2)?'hint':''}" data-i="${i}"
      style="transform:translateX(${x.toFixed(1)}px) rotate(${rot.toFixed(1)}deg) translateY(${(Math.abs(t)*26).toFixed(1)}px); z-index:${i}">
      ${cardBack()}</div>`;
  }).join('');
  fan.querySelectorAll('.fc').forEach(el=>el.onclick = ()=>pickCard(Number(el.dataset.i)));
}
function pickCard(i){
  if(T.picked.length>=3) return toast('Три карты уже вытянуты — переверни их','✦');
  if(T.picked.some(p=>p.i===i)) return;
  T.picked.push({i, key:T.order[i], rev:T.revs[i]});
  /* Вытянуть карту — главный жест приложения. Стоял 'light', то есть слабейший
     «удар», который на Android не ощущается совсем (см. haptic): пользователь
     решил, что отдачи нет вообще. 'reveal' — уведомление, оно срабатывает. */
  haptic('reveal');
  renderFan(); renderSlots();
  const hint = document.getElementById('fanHint');
  hint.textContent = T.picked.length<3
    ? `Вытянуто ${T.picked.length} из 3 — выбирай не думая`
    : 'Теперь переверни каждую карту';
}
function renderSlots(){
  const labels = ['Ситуация','Вызов','Совет'];
  const slots = document.getElementById('slots');
  slots.innerHTML = labels.map((l,i)=>{
    const p = T.picked[i];
    return `<div class="slot">
      ${p ? tarotCardHTML(p.key, {flipped:T.flipped[i], rev:p.rev, attrs:`data-slot="${i}"`})
          : '<div class="tcard empty">✦</div>'}
      <div class="slot-l">${l}</div>
    </div>`;
  }).join('');
  slots.querySelectorAll('[data-slot]').forEach(el=>el.onclick = ()=>{
    const i = Number(el.dataset.slot);
    if(T.flipped[i]) return;
    T.flipped[i] = true;
    el.classList.add('flipped');
    haptic('reveal');           // раскрытие карты обязано ощущаться — см. haptic()
    collectArcana(T.picked[i].key);
    const allFlipped = T.flipped.every(Boolean) && T.picked.length===3;
    document.getElementById('readTarot').disabled = !allFlipped;
    if(allFlipped){
      document.getElementById('fanHint').textContent = 'Все три открыты — оракул готов говорить';
      toast('Карты открыты. Читаем расклад.','✦');
    }
  });
}
async function readTarot(){
  const q = document.getElementById('tarotQ').value.trim();
  if(q.length<5) return toast('Сформулируй вопрос — иначе ответ будет ни о чём','·');
  if(!T.flipped.every(Boolean)) return toast('Переверни все три карты','✦');
  if(!gate()) return;
  const btn = document.getElementById('readTarot');
  const ctx = baseCtx({q, cards:T.picked.map(p=>({key:p.key, rev:p.rev}))});
  const names = T.picked.map(p=>DECK_BY[p.key][1]).join(' · ');
  await output('tarot', ctx, names, 'Толкование расклада', btn);
}

/* --------------------------------- ШЕРИНГ -------------------------------- */
function share(title, paras){
  const txt = `🔮 ${title}\n\n${paras.join('\n\n').replace(/<[^>]+>/g,'')}\n\nМой оракул: https://t.me/${BOT}`;
  let doneMsg = 'Скопировано.';
  if(TG_CAN.inline){
    /* Нативный выбор чата в Telegram — конверсия выше, чем «скопировано,
       вставь сам». Требует /setinline в BotFather (см. INLINE_ENABLED). */
    tgSafe(()=> TG.switchInlineQuery(txt.slice(0,256), ['users','groups']));
    doneMsg = 'Выбери, кому отправить.';
  } else if(navigator.share){
    navigator.share({title:'Oraculum', text:txt}).catch(()=>{});
    doneMsg = 'Готово.';
  } else {
    navigator.clipboard?.writeText(txt).catch(()=>{});
  }
  /* Награда не чаще раза в сутки: без лимита кнопка «Поделиться» превращается
     в бесконечный источник валюты, и подписка теряет смысл. */
  if(S.shareDay === todayKey()){
    toast(`${doneMsg} Награда за шеринг — раз в сутки`,'·');
    return;
  }
  S.shareDay = todayKey(); save();
  addSparks(SHARE_REWARD);
  refreshHud();
  toast(`${doneMsg} Отправишь другу — получишь бонус`,'✧ +'+SHARE_REWARD);
}
/* Сторис — самый дешёвый охват в Telegram: карточка видна всем подписчикам
   истории без перехода по ссылке. Картинка обязана быть публичным https-URL
   (Telegram не принимает data:/blob:), поэтому берём готовый статичный
   промо-баннер, а не рисуем разбор на лету — под него нужен сервер рендеринга,
   которого в прототипе нет. Если файл assets/ не выложен на хостинг вместе с
   index.html, вызов тихо ничего не сделает (см. tgSafe) — не ломает интерфейс. */
function shareStory(){
  if(!TG_CAN.story) return;
  const media = new URL('assets/oraculum-cover-640x360.png', location.href).href;
  tgSafe(()=> TG.shareToStory(media, {
    text: 'Мой персональный оракул',
    widget_link: { url: `https://t.me/${BOT}`, name: 'Открыть Oraculum' }
  }));
}

/* ==========================================================================
   ПЛАТЁЖНАЯ ВОРОНКА
   ========================================================================== */
/* Зачёркнутых «старых» цен здесь нет намеренно: по 640 ⭐ месяц никогда не
   продавался, значит и «−38%» от этой цифры — выдумка, а не скидка. Убрано и
   «выбор 89% пользователей»: статистики не существует, пользователей пока ноль.
   Единственное сравнение, которое можно показывать, — свой же годовой тариф
   против двенадцати месячных: 399 × 12 = 4788 против 2990, это настоящие −38%.
   Цифра проверяемая, поэтому вынесена в описание тарифа, а не только в ленту. */
const PLANS = [
  {id:'week',  n:'Неделя', d:'попробовать без риска',           p:149,  tag:''},
  {id:'month', n:'Месяц',  d:'полный доступ, продление вручную',p:399,  tag:''},
  {id:'year',  n:'Год',    d:'2990 ⭐ вместо 4788 ⭐ по месяцам', p:2990, tag:'−38%'},
];
let PAY = {plan:'month'};

function openPaywall(reason){
  const head = reason==='limit'
    ? {h:'Бесплатные разборы на сегодня закончились', s:'Оракул готов продолжать — осталось выбрать формат.'}
    : reason==='sparks'
    ? {h:'Искр не хватает', s:'Искры зарабатываются заданиями и колесом — или можно просто открыть всё сразу.'}
    : {h:'Oraculum Premium', s:'Без лимитов, глубокие разборы и утренний прогноз в Telegram.'};

  const ov = document.getElementById('ovPay');
  ov.innerHTML = `<div class="sheet">
    <div class="grab"></div>
    <h2>${head.h}</h2>
    <p class="ssub">${head.s}</p>
    <div class="plans" id="plans">
      ${PLANS.map(p=>`
        <div class="plan ${PAY.plan===p.id?'on':''}" data-plan="${p.id}">
          ${p.tag?`<div class="ribbon">${p.tag}</div>`:''}
          <div><div class="pn">${p.n}</div><div class="pd">${p.d}</div></div>
          <div class="pp">${p.p} ⭐</div>
        </div>`).join('')}
    </div>
    <div class="vlist">
      <div class="vrow"><span class="vi">✓</span><span>Неограниченные разборы у всех пяти оракулов</span></div>
      <!-- Перечисляются ровно те разделы, которые возвращает deepSections(), и в
           том же порядке. «Транзиты» отсюда убраны: эфемерид приложение не считает,
           а обещать их — то же самое, что обещать скидку с несуществующей цены. -->
      <div class="vrow"><span class="vi">✓</span><span>Глубокий разбор к каждому раскладу: страх под вопросом, план на 21 день, повторяющийся сценарий, окна недели</span></div>
      <div class="vrow"><span class="vi">✓</span><span>Утренний прогноз приходит в Telegram сам</span></div>
      <div class="vrow"><span class="vi">✓</span><span>Полная история и память оракула о твоих вопросах</span></div>
    </div>
    <!-- Пока нет бэкенда, оплата имитируется. Кнопка обязана говорить это прямо:
         текст «Оплатить через Stars» на кнопке, которая ничего не списывает,
         в публичном демо читается как обман. Меняется на реальный invoice
         одновременно с подключением серверного successful_payment. -->
    <button class="btn btn-primary" id="payBtn">Открыть Premium · демо без оплаты</button>
    ${S.sparks>=SPARK_COST && reason==='limit' ? `<button class="btn btn-ghost" style="margin-top:8px" id="paySpark">Открыть один разбор за ✧ ${SPARK_COST}</button>`:''}
    <button class="btn btn-ghost" style="margin-top:8px" id="payRef">Получить бесплатно — позвать друга</button>
    <button class="btn btn-ghost" style="margin-top:8px" id="payNo">Не сейчас</button>
    <div class="disc">Демонстрационный экран. В Telegram Mini App оплата проходит нативным окном Stars: без карт, без редиректов, продавец получает выплату от Telegram.</div>
  </div>`;
  ov.classList.add('show');
  haptic('warn');

  ov.querySelectorAll('[data-plan]').forEach(p=>p.onclick = ()=>{
    PAY.plan = p.dataset.plan;
    ov.querySelectorAll('[data-plan]').forEach(x=>x.classList.toggle('on', x.dataset.plan===PAY.plan));
    haptic('light');
  });
  document.getElementById('payBtn').onclick = mockPay;
  document.getElementById('payNo').onclick = closePay;
  document.getElementById('payRef').onclick = ()=>{ closePay(); go('profile'); setTimeout(()=>document.getElementById('invite')?.click(), 380); };
  const ps = document.getElementById('paySpark');
  if(ps) ps.onclick = ()=>{
    S.sparks -= SPARK_COST; S.free.used = Math.max(0, S.free.used-1); save();
    closePay(); toast('Разбор разблокирован за искры','🔓'); render();
  };
  ov.onclick = e=>{ if(e.target===ov) closePay(); };
}
function closePay(){
  document.getElementById('ovPay').classList.remove('show');
}
function mockPay(){
  const p = PLANS.find(x=>x.id===PAY.plan);
  S.sub = true; S.subPlan = `${p.n} · ${p.p} ⭐`; save();
  closePay(); haptic('ok');
  modalReward({
    icon:'★', title:'Premium активирован',
    text:`Тариф «${p.n}». Лимиты сняты — все глубокие разборы открыты, утренний прогноз включён.`,
    btn:'Начать', onOk:()=>render()
  });
}
/* -------------------------------- модалка -------------------------------- */
function modalReward(o){
  const ov = document.getElementById('ovModal');
  ov.innerHTML = `<div class="sheet">
    <div class="rays"></div>
    ${o.art ? `<div style="display:flex; justify-content:center; margin-bottom:10px">${tarotCardHTML(o.art,{flipped:true})}</div>`
             : `<div class="burst">${o.icon||'✦'}</div>`}
    <h2>${o.title}</h2>
    <p class="ssub" style="margin-bottom:${o.bonus?'10px':'16px'}">${o.text}</p>
    ${o.bonus?`<div class="chip" style="margin:0 auto 16px; display:inline-flex">${o.bonus}</div>`:''}
    <button class="btn btn-primary" id="mOk">${o.btn||'Хорошо'}</button>
    ${o.cancel?`<button class="btn btn-ghost" style="margin-top:8px" id="mNo">${o.cancel}</button>`:''}
  </div>`;
  ov.classList.add('show');
  document.getElementById('mOk').onclick = ()=>{ ov.classList.remove('show'); o.onOk && o.onOk(); };
  const no = document.getElementById('mNo');
  if(no) no.onclick = ()=>ov.classList.remove('show');
  ov.onclick = e=>{ if(e.target===ov) ov.classList.remove('show'); };
}

/* ---------------------------------- BOOT --------------------------------- */
(function boot(){
  sky();
  captureEnv();
  const src = S.onboarded ? routeStart() : '';
  if(S.onboarded){
    const fresh = touchStreak();
    render();
    if(src && START_ROUTES[src.split('_')[0]]){
      setTimeout(()=>toast('Открыто из уведомления — заход засчитан в атрибуцию','✦'), 400);
      if(src.startsWith('pay')) setTimeout(()=>openPaywall('plans'), 900);
    }
    applyPendingRef();
    checkAch();
    if(fresh && S.streak.count>1){
      setTimeout(()=>toast(S._usedFreeze
        ? `Страховка сработала: серия ${S.streak.count} ${plural(S.streak.count,'день','дня','дней')} сохранена`
        : `Серия продолжается: ${S.streak.count} ${plural(S.streak.count,'день','дня','дней')} подряд`, '🔥'), 700);
    }
    if(S.streak.count===7 && !S.seen.week7){
      S.seen.week7 = 1; save();
      /* Обещание в интерфейсе — «бонусный глубокий разбор», поэтому награда
         равна его цене ровно, а не «примерно». Срабатывает один раз. */
      setTimeout(()=>modalReward({icon:'★', title:'Семь дней подряд', text:'Обещанный бонус: один глубокий разбор бесплатно.',
        btn:'Забрать', bonus:`+${SPARK_COST} искр`, onOk:()=>{ addSparks(SPARK_COST); render(); }}), 1200);
    }
  } else {
    render();
  }
})();
</script>
